<script>
  // --- 資料緩存與目錄 ---
  let userId = ""; let userName = ""; let userSessionToken = ""; let globalProgress = {};
  let userAccount = ""; let loginMode = 'login'; // 登入/註冊模式
  let groupId = ""; // 由 URL 參數帶入，表示當前 LINE 群組
  let currentTestament = "Plan"; let selectedBook = ""; let currentPlanDay = 1;
  let isSavingProgress = false;
  let isLsMode = false;
  let currentLsItems = [];
  let currentStatsData = null;
  let statsMode = 'list';
  let statsChartInstance = null;

  async function hashPin(pin) {
    const encoder = new TextEncoder();
    const data = encoder.encode(pin);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return btoa(String.fromCharCode.apply(null, new Uint8Array(hashBuffer)));
  }

  // 靜態資料已搬移至後端，並改為 LocalStorage 快取載入
  let lsMapping = null;
  let YEAR_PLAN_DATA = null;
  let BIBLE_DATA = null;
  let OT_BOOKS_SHORT_SET = null;
  let NT_BOOKS_SHORT_SET = null;
  let TOTAL_OT = 0;
  let TOTAL_NT = 0;
  let TOTAL_PLAN = 0;
  const TOTAL_LS_OT = 1381;
  const TOTAL_LS_NT = 603;
  const TOTAL_LS = TOTAL_LS_OT + TOTAL_LS_NT;

  function loadStaticDataAndInit() {
    const cached = localStorage.getItem('BIBLE_STATIC_DATA');
    if (cached) {
      try {
        const data = JSON.parse(cached);
        lsMapping = data.lsMapping;
        YEAR_PLAN_DATA = data.YEAR_PLAN_DATA;
        BIBLE_DATA = data.BIBLE_DATA;
        OT_BOOKS_SHORT_SET = new Set(data.OT_BOOKS_SHORT_SET);
        NT_BOOKS_SHORT_SET = new Set(data.NT_BOOKS_SHORT_SET);

        TOTAL_OT = BIBLE_DATA.OT.reduce((sum, b) => sum + b.c, 0);
        TOTAL_NT = BIBLE_DATA.NT.reduce((sum, b) => sum + b.c, 0);
        TOTAL_PLAN = YEAR_PLAN_DATA.length;

        console.log("靜態資料從 localStorage 快取載入完成");
        startApp();
        return;
      } catch (e) {
        console.warn("快取解析失敗，將重新下載", e);
      }
    }

    // 顯示載入狀態
    const msgEl = document.getElementById('loading-msg');
    if (msgEl) msgEl.innerText = "下載系統資源中...";

    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler(function (data) {
          if (data) {
            try {
              localStorage.setItem('BIBLE_STATIC_DATA', JSON.stringify(data));
              lsMapping = data.lsMapping;
              YEAR_PLAN_DATA = data.YEAR_PLAN_DATA;
              BIBLE_DATA = data.BIBLE_DATA;
              OT_BOOKS_SHORT_SET = new Set(data.OT_BOOKS_SHORT_SET);
              NT_BOOKS_SHORT_SET = new Set(data.NT_BOOKS_SHORT_SET);

              TOTAL_OT = BIBLE_DATA.OT.reduce((sum, b) => sum + b.c, 0);
              TOTAL_NT = BIBLE_DATA.NT.reduce((sum, b) => sum + b.c, 0);
              TOTAL_PLAN = YEAR_PLAN_DATA.length;

              console.log("靜態資料下載成功並寫入快取");
              startApp();
            } catch (e) {
              console.error("快取寫入失敗", e);
              lsMapping = data.lsMapping;
              YEAR_PLAN_DATA = data.YEAR_PLAN_DATA;
              BIBLE_DATA = data.BIBLE_DATA;
              OT_BOOKS_SHORT_SET = new Set(data.OT_BOOKS_SHORT_SET);
              NT_BOOKS_SHORT_SET = new Set(data.NT_BOOKS_SHORT_SET);

              TOTAL_OT = BIBLE_DATA.OT.reduce((sum, b) => sum + b.c, 0);
              TOTAL_NT = BIBLE_DATA.NT.reduce((sum, b) => sum + b.c, 0);
              TOTAL_PLAN = YEAR_PLAN_DATA.length;

              startApp();
            }
          } else {
            alert("下載系統資料失敗，請重新整理頁面。");
          }
        })
        .withFailureHandler(function (err) {
          alert("連線後端失敗: " + err);
        })
        .getStaticBibleData();
    } else {
      console.warn("Google API 未載入，靜態資料初始化為空");
      startApp();
    }
  }

  // 重新引入前端生命讀經輔助函數 (維持 DOM 渲染正常)
  function formatLsName(lsName) {
    if (!lsName) return { prefix: "", num: "" };
    if (lsName === "無") return { prefix: "無", num: "" };
    // 解析 "創生讀26" 或 "得生讀 1" -> {prefix: "創", num: "26"}
    const match = lsName.match(/^(.+?)生讀\s?(\d+.*)$/);
    if (match) return { prefix: match[1], num: match[2] };
    return { prefix: lsName, num: "" };
  }

  // Helper to extract LS from mapping
  function getLsForRange(rangeStr) {
    if (!rangeStr) return [];
    // 嘗試精確匹配 (CSV 轉出的 JSON 鍵值)
    const key = rangeStr.trim();
    if (lsMapping.range_map[key]) return lsMapping.range_map[key];

    // 模糊匹配 (處理可能的空白字元差異)
    const normalizedKey = key.replace(/\s+/g, '');
    for (let k in lsMapping.range_map) {
      if (k.replace(/\s+/g, '') === normalizedKey) return lsMapping.range_map[k];
    }
    return [];
  }

  function renderLsSection(day) {
    const lsWrap = document.getElementById('ls-chips-wrap');
    const lsSection = document.getElementById('ls-section');
    lsWrap.innerHTML = '';

    const parts = YEAR_PLAN_DATA[day - 1].split(' / ');
    const otRange = parts[0];
    const ntRange = parts[1] || '';

    const lsList = [...getLsForRange(otRange), ...getLsForRange(ntRange)];
    const uniqueLs = Array.from(new Set(lsList)).filter(name => {
      return name && name !== "無" && name !== "＿" && name.includes("生讀");
    });

    if (uniqueLs.length === 0) {
      lsSection.style.display = 'none';
      return;
    }

    lsSection.style.display = 'block';
    const lsDoneSet = new Set(globalProgress['LifeStudy'] || []);

    // 按書卷分組
    const groups = {};
    uniqueLs.forEach(lsName => {
      if (!lsName || lsName === "無" || lsName === "＿" || !lsName.includes("生讀")) return;
      const info = formatLsName(lsName);
      if (!groups[info.prefix]) groups[info.prefix] = [];
      groups[info.prefix].push({ name: lsName, num: info.num });
    });

    for (let prefix in groups) {
      const groupRow = document.createElement('div');
      groupRow.style.width = '100%';
      groupRow.style.marginBottom = '8px';
      groupRow.style.display = 'flex';
      groupRow.style.flexWrap = 'wrap';
      groupRow.style.gap = '8px';
      groupRow.style.alignItems = 'center';

      const label = document.createElement('span');
      label.style.color = '#f39c12';
      label.style.fontSize = '13px';
      label.style.fontWeight = 'bold';
      label.style.marginRight = '4px';
      label.innerText = prefix + '：';
      groupRow.appendChild(label);

      groups[prefix].forEach(item => {
        const chip = document.createElement('div');
        const isDone = lsDoneSet.has(item.name);
        chip.className = 'ls-chip' + (isDone ? ' done' : '');
        chip.dataset.lsName = item.name;
        chip.innerText = item.num;
        chip.onclick = () => {
          if (chip.classList.contains('done')) {
            chip.classList.toggle('pending-remove');
          } else {
            chip.classList.toggle('selected');
          }
          checkPlanSave();
        };
        groupRow.appendChild(chip);
      });
      lsWrap.appendChild(groupRow);
    }
  }


  // --- 初始化 ---
  function startApp() {
    // 從 GAS template 變數取得 groupId (已由 index.html 的全域變數定義)
    groupId = (templateGroupId && templateGroupId !== "undefined" && templateGroupId !== "") ? templateGroupId.trim() : "";

    if (!groupId) {
      document.getElementById('loading-spinner').style.display = 'none';
      document.getElementById('login-card').style.display = 'none';
      const overlay = document.getElementById('login-overlay');
      overlay.style.display = 'flex';
      overlay.innerHTML = '<div style="text-align:center; padding:30px;"><div style="font-size:48px;">⚠️</div><div style="font-size:16px; font-weight:bold; color:#e74c3c; margin-top:12px;">連結無效</div><div style="font-size:13px; color:#666; margin-top:8px;">請透過 LINE 群組的專屬連結進入</div></div>';
      return;
    }

    const prevGroupId = localStorage.getItem('bible_gid');
    localStorage.setItem('bible_gid', groupId);
    const groupChanged = prevGroupId && prevGroupId !== groupId;
    console.log("應用程式啟動: groupId=" + groupId + ", prevGroupId=" + prevGroupId + ", groupChanged=" + groupChanged);



    const savedUid = localStorage.getItem('bible_uid');
    const savedName = localStorage.getItem('bible_username');
    const savedToken = localStorage.getItem('bible_session_token');
    const savedAccount = localStorage.getItem('bible_account');
    console.log("應用程式啟動: savedUid=" + savedUid + ", groupId=" + groupId);

    if (savedUid && savedName && savedToken && savedAccount) {
      userId = savedUid; userSessionToken = savedToken; userName = savedName; userAccount = savedAccount;
      document.getElementById('display-name').innerText = userName;
      console.log("使用已保存的登入: userId=" + userId);

      // 群組已切換 → 清除憑證與快取，強制重新登入
      if (groupChanged) {
        console.log("群組已切換，清除登入憑證，要求重新登入");
        localStorage.removeItem('bible_uid');
        localStorage.removeItem('bible_username');
        localStorage.removeItem('bible_session_token');
        localStorage.removeItem('bible_account');
        localStorage.removeItem('bible_progress_' + prevGroupId);
        userId = ""; userSessionToken = ""; userName = ""; userAccount = ""; globalProgress = {};
        setTimeout(() => {
          document.getElementById('loading-spinner').style.display = 'none';
          document.getElementById('login-card').style.display = 'block';
        }, 300);
        return;
      } else {
        // 嘗試從 localStorage 載入快取進度，實現零等待
        const cachedProgress = localStorage.getItem('bible_progress_' + groupId);
        if (cachedProgress) {
          try {
            globalProgress = JSON.parse(cachedProgress);
            console.log("已從本地快取載入進度，立即渲染");
            document.getElementById('login-overlay').style.display = 'none';
            switchTestament('Plan');
            // 背景靜默同步伺服器
            syncGlobalProgress(true);
          } catch (e) {
            console.error("本地快取解析失敗，改為伺服器同步", e);
            localStorage.removeItem('bible_progress_' + groupId);
            syncGlobalProgress(false);
          }
        } else {
          syncGlobalProgress(false);
        }
      }
    } else {
      console.log("未找到已保存登入，顯示登入畫面");
      setTimeout(() => {
        document.getElementById('loading-spinner').style.display = 'none';
        document.getElementById('login-card').style.display = 'block';
      }, 300);
    }
  }

  function saveProgressToLocal() {
    try { localStorage.setItem('bible_progress_' + groupId, JSON.stringify(globalProgress)); }
    catch (e) { console.warn("localStorage 寫入失敗", e); }
  }

  function syncGlobalProgress(silent) {
    const currentUserId = userId;
    if (!silent) {
      document.getElementById('loading-msg').innerText = "進度同步中...";
    }
    console.log("開始同步進度: userId=" + userId + ", groupId=" + groupId + ", silent=" + silent);
    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler(data => {
          if (userId !== currentUserId) { console.log("帳號已切換，丟棄舊資料"); return; }
          if (data && data.__error) { console.error("進度讀取失敗: " + data.message); if (!silent) globalProgress = {}; }
          else { globalProgress = data || {}; saveProgressToLocal(); }
          console.log("進度同步完成", globalProgress);
          if (!silent) {
            document.getElementById('login-overlay').style.display = 'none';
            switchTestament('Plan');
          } else {
            // 靜默同步完成，重新渲染當前視圖
            if (currentTestament === 'Plan') renderPlanGrid();
            else renderBookList();
          }
        })
        .withFailureHandler(err => {
          if (userId !== currentUserId) { console.log("帳號已切換，丟棄舊錯誤"); return; }
          console.error("進度同步失敗", err);
          if (!silent) {
            document.getElementById('login-overlay').style.display = 'none';
            switchTestament('Plan');
          }
        })
        .getAllUserProgress(userId, userAccount, userSessionToken, groupId);
    } else {
      if (!silent) {
        document.getElementById('login-overlay').style.display = 'none';
        switchTestament('Plan');
      }
    }
  }

  function toggleLoginMode() {
    loginMode = loginMode === 'login' ? 'register' : 'login';
    const isRegister = loginMode === 'register';
    document.getElementById('display-name-input').style.display = isRegister ? 'block' : 'none';
    document.getElementById('pin-confirm-input').style.display = isRegister ? 'block' : 'none';
    document.getElementById('login-btn').innerText = isRegister ? '建立帳號' : '進入系統';
    document.getElementById('login-card-title').innerText = isRegister ? '📝 建立帳號' : '📖 讀經進度紀錄';
    document.getElementById('toggle-mode-link').innerText = isRegister ? '← 返回登入' : '📝 我要註冊';
  }

  async function handleLogin() {
    const account = document.getElementById('account-input').value.trim();
    const p = document.getElementById('pin-input').value.trim();

    if (!account) return showToast("請輸入帳號");
    if (!p) return showToast("請輸入密碼");

    document.getElementById('login-card').style.display = 'none';
    document.getElementById('loading-spinner').style.display = 'block';

    let pinHash = "";
    try {
      pinHash = await hashPin(p);
    } catch (e) {
      document.getElementById('login-card').style.display = 'block';
      document.getElementById('loading-spinner').style.display = 'none';
      return showToast("密碼處理失敗: " + e.message);
    }

    function onSuccess(result) {
      if (result && result.success) {
        userId = result.userId; userSessionToken = result.sessionToken; userName = result.displayName; userAccount = account;
        localStorage.setItem('bible_uid', userId);
        localStorage.setItem('bible_username', userName);
        localStorage.setItem('bible_session_token', userSessionToken);
        localStorage.setItem('bible_account', account);
        document.getElementById('display-name').innerText = userName;
        syncGlobalProgress();
      } else {
        document.getElementById('login-card').style.display = 'block';
        document.getElementById('loading-spinner').style.display = 'none';
        showToast(result && result.message ? result.message : '操作失敗');
      }
    }

    function onError(err) {
      document.getElementById('login-card').style.display = 'block';
      document.getElementById('loading-spinner').style.display = 'none';
      showToast('錯誤: ' + err);
    }

    if (loginMode === 'register') {
      const displayName = document.getElementById('display-name-input').value.trim();
      const confirmPin = document.getElementById('pin-confirm-input').value.trim();
      if (!displayName) {
        document.getElementById('login-card').style.display = 'block';
        document.getElementById('loading-spinner').style.display = 'none';
        return showToast("請輸入姓名");
      }
      if (p !== confirmPin) {
        document.getElementById('login-card').style.display = 'block';
        document.getElementById('loading-spinner').style.display = 'none';
        return showToast("兩次密碼不一致");
      }
      let confirmPinHash = "";
      try {
        confirmPinHash = await hashPin(confirmPin);
      } catch (e) {
        document.getElementById('login-card').style.display = 'block';
        document.getElementById('loading-spinner').style.display = 'none';
        return showToast("密碼處理失敗: " + e.message);
      }
      document.getElementById('loading-msg').innerText = "建立帳號中...";
      if (typeof google !== 'undefined') {
        google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError)
          .registerUser(account, pinHash, confirmPinHash, displayName);
      } else {
        // dev fallback
        userId = account + "_" + pinHash; userSessionToken = pinHash; userName = displayName; userAccount = account;
        localStorage.setItem('bible_uid', userId); localStorage.setItem('bible_username', userName);
        localStorage.setItem('bible_session_token', pinHash); localStorage.setItem('bible_account', account);
        document.getElementById('display-name').innerText = userName;
        syncGlobalProgress();
      }
    } else {
      document.getElementById('loading-msg').innerText = "驗證中...";
      if (typeof google !== 'undefined') {
        google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError)
          .loginUser(account, pinHash);
      } else {
        // dev fallback
        userId = account + "_" + pinHash; userSessionToken = pinHash; userName = account; userAccount = account;
        localStorage.setItem('bible_uid', userId); localStorage.setItem('bible_username', userName);
        localStorage.setItem('bible_session_token', pinHash); localStorage.setItem('bible_account', account);
        document.getElementById('display-name').innerText = userName;
        syncGlobalProgress();
      }
    }
  }

  function handleLogout() {
    showConfirm("登出會回到登入畫面，確定嗎？", function () {
      localStorage.removeItem('bible_uid');
      localStorage.removeItem('bible_username');
      localStorage.removeItem('bible_session_token');
      localStorage.removeItem('bible_account');
      localStorage.removeItem('bible_progress_' + groupId);
      userId = ""; userSessionToken = ""; userName = ""; userAccount = ""; globalProgress = {};
      loginMode = 'login';
      // 重置登入卡片為登入模式
      document.getElementById('account-input').value = '';
      document.getElementById('pin-input').value = '';
      document.getElementById('display-name-input').style.display = 'none';
      document.getElementById('pin-confirm-input').style.display = 'none';
      document.getElementById('login-btn').innerText = '進入系統';
      document.getElementById('login-card-title').innerText = '📖 讀經進度紀錄';
      document.getElementById('toggle-mode-link').innerText = '📝 我要註冊';
      document.getElementById('loading-spinner').style.display = 'none';
      document.getElementById('login-card').style.display = 'block';
      document.getElementById('login-overlay').style.display = 'flex';
    });
  }

  // --- 視圖控制 ---
  function switchTestament(type) {
    currentTestament = type;
    ['OT', 'NT', 'Plan', 'LS'].forEach(t => document.getElementById('tab-' + t).classList.toggle('active', t === type));
    if (type === 'Plan') {
      document.getElementById('tab-content-books').style.display = 'none';
      document.getElementById('tab-content-plan').style.display = 'block';
      document.getElementById('tab-content-ls').style.display = 'none';
      renderPlanGrid();
    } else if (type === 'LS') {
      document.getElementById('tab-content-books').style.display = 'none';
      document.getElementById('tab-content-plan').style.display = 'none';
      document.getElementById('tab-content-ls').style.display = 'block';
      renderLsBookList();
    } else {
      document.getElementById('tab-content-plan').style.display = 'none';
      document.getElementById('tab-content-ls').style.display = 'none';
      document.getElementById('tab-content-books').style.display = 'flex';
      renderBookList();
    }
  }

  function closeToMain() {
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-main').classList.add('active');
    if (currentTestament === 'Plan') renderPlanGrid();
    else if (currentTestament === 'LS') renderLsBookList();
    else renderBookList();
  }

  function openMorePage() {
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-clear').classList.add('active');
  }

  function toggleStatsInfo() {
    document.getElementById('stats-info-popup').classList.toggle('visible');
  }

  function closeStatsInfo() {
    document.getElementById('stats-info-popup').classList.remove('visible');
  }

  function toggleGuidePopup() {
    document.getElementById('guide-popup').classList.toggle('visible');
  }

  function closeGuidePopup() {
    document.getElementById('guide-popup').classList.remove('visible');
  }

  function openMembersStats() {
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-stats').classList.add('active');

    // 預設切換至列表模式，或維持上次設定
    switchStatsMode(statsMode);

    const container = document.getElementById('stats-list-container');
    container.innerHTML = '<div style="text-align:center; padding: 30px;"><div class="spinner"></div><div style="margin-top:10px; color:#666; font-size:14px;">載入中...</div></div>';

    if (statsChartInstance) {
      statsChartInstance.destroy();
      statsChartInstance = null;
    }
    currentStatsData = null;

    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler(renderMembersStats)
        .withFailureHandler(err => {
          container.innerHTML = `<div style="color:red; text-align:center; padding: 20px;">載入失敗: ${err}</div>`;
        })
        .getGroupMemberStats(groupId, userId, userAccount, userSessionToken);
    } else {
      setTimeout(() => {
        renderMembersStats({
          status: 'success',
          members: [
            { username: '測試用戶A', source: 'plan', planDays: 100, otChapters: 256, ntChapters: 72, lsOT: 500, lsNT: 200 },
            { username: '測試用戶B', source: 'free', otChapters: 120, ntChapters: 50, lsOT: 100, lsNT: 50 },
            { username: '測試用戶C', source: 'free', otChapters: 800, ntChapters: 200, lsOT: 1000, lsNT: 400 },
            { username: '測試用戶D', source: 'plan', planDays: 50, otChapters: 400, ntChapters: 150, lsOT: 600, lsNT: 300 },
          ],
          totalOT: 929, totalNT: 260
        });
      }, 500);
    }
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function renderMembersStats(data) {
    currentStatsData = data;
    
    const container = document.getElementById('stats-list-container');
    if (!data || data.status === 'error') {
      container.innerHTML = `<div style="color:red; text-align:center; padding: 20px;">${data?.message || '載入失敗'}</div>`;
      return;
    }

    const members = data.members || [];
    const tOT = data.totalOT || 929;
    const tNT = data.totalNT || 260;
    
    // 列表模式預設以聖經進度排序
    const sortedMembers = [...members].sort((a, b) => (b.otChapters + b.ntChapters) - (a.otChapters + a.ntChapters));

    if (sortedMembers.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#888; padding: 20px;">目前無成員資料</div>';
      return;
    }

    const pct = (d, t) => t === 0 ? 0 : parseFloat(((d / t) * 100).toFixed(1));

    let html = '';
    sortedMembers.forEach((m, idx) => {
      const otPct = pct(m.otChapters, tOT);
      const ntPct = pct(m.ntChapters, tNT);

      html += `
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-name">${idx + 1}. ${escapeHtml(m.username)}</div>
          </div>
          <div class="stat-progress-section">
            <div class="stat-progress-label"><span>📜 舊約</span><span>${otPct}%</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${otPct}%"></div></div>
            <div class="stat-total">${m.otChapters} / ${tOT} 章</div>
          </div>
          <div class="stat-progress-section">
            <div class="stat-progress-label"><span>📖 新約</span><span>${ntPct}%</span></div>

  window.renderStatsChart = function(data) {
    const showOT = document.getElementById('chk-chart-ot').checked;
    const showNT = document.getElementById('chk-chart-nt').checked;
    const showLs = document.getElementById('chk-chart-ls').checked;
    const range = document.getElementById('sel-chart-range').value;
    const wrapper = document.getElementById('chart-canvas-wrapper');

    if (statsChartInstance) {
      statsChartInstance.destroy();
      statsChartInstance = null;
    }

    if (!showOT && !showNT && !showLs) {
      wrapper.innerHTML = '<canvas id="stats-chart"></canvas><div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#888; font-size:14px; text-align:center; width:100%;">⚠️ 請至少選取一項統計項目</div>';
      return;
    }

    wrapper.innerHTML = '<canvas id="stats-chart"></canvas>';
    const canvas = document.getElementById('stats-chart');

    const members = data.members || [];
    const tOT = data.totalOT || 929;
    const tNT = data.totalNT || 260;
    const totalLs = TOTAL_LS_OT + TOTAL_LS_NT;

    const calcPct = (d, t) => t === 0 ? 0 : parseFloat(((d / t) * 100).toFixed(1));

    // 計算百分比與排序權重
    const processed = members.map(m => {
      const otPct = calcPct(m.otChapters, tOT);
      const ntPct = calcPct(m.ntChapters, tNT);
      const lsPct = calcPct((m.lsOT || 0) + (m.lsNT || 0), totalLs);
      
      let sum = 0;
      let count = 0;
      if (showOT) { sum += otPct; count++; }
      if (showNT) { sum += ntPct; count++; }
      if (showLs) { sum += lsPct; count++; }
      const sortValue = count > 0 ? (sum / count) : 0;

      return {
        username: m.username,
        otPct: otPct,
        ntPct: ntPct,
        lsPct: lsPct,
        sortValue: sortValue
      };
    });

    // 依據計算的排序權重由大到小排序
    processed.sort((a, b) => b.sortValue - a.sortValue);

    // 篩選 Top N
    let displayed = processed;
    if (range !== 'all') {
      const limit = parseInt(range, 10);
      displayed = processed.slice(0, limit);
    }

    if (displayed.length === 0) {
      return;
    }

    // 找出當前顯示資料中的最高百分比值以決定自適應上限
    let maxVal = 0;
    displayed.forEach(item => {
      if (showOT) maxVal = Math.max(maxVal, item.otPct);
      if (showNT) maxVal = Math.max(maxVal, item.ntPct);
      if (showLs) maxVal = Math.max(maxVal, item.lsPct);
    });

    // 階梯式自適應 X 軸上限，突顯低進度時的視覺起伏
    let xAxisMax = 100;
    if (maxVal <= 10) {
      xAxisMax = 15;
    } else if (maxVal <= 25) {
      xAxisMax = 30;
    } else if (maxVal <= 50) {
      xAxisMax = 60;
    } else {
      xAxisMax = 100;
    }

    // 動態計算 Canvas 高度，依據勾選項數量給予不同的成員列高度，避免長條重疊
    const activeBarsCount = (showOT ? 1 : 0) + (showNT ? 1 : 0) + (showLs ? 1 : 0);
    const rowHeight = activeBarsCount === 3 ? 55 : (activeBarsCount === 2 ? 45 : 35);
    const dynamicHeight = Math.max(300, displayed.length * rowHeight + 80);
    canvas.style.height = dynamicHeight + 'px';
    canvas.height = dynamicHeight;

    const labels = displayed.map(item => item.username);
    const datasets = [];
    const barThickness = activeBarsCount === 3 ? 9 : (activeBarsCount === 2 ? 13 : 20);

    if (showOT) {
      datasets.push({
        label: '📜 舊約進度 (%)',
        data: displayed.map(item => item.otPct),
        backgroundColor: 'rgba(76, 175, 80, 0.85)',
        borderColor: '#4CAF50',
        borderWidth: 1,
        barThickness: barThickness
      });
    }

    if (showNT) {
      datasets.push({
        label: '📖 新約進度 (%)',
        data: displayed.map(item => item.ntPct),
        backgroundColor: 'rgba(33, 150, 243, 0.85)',
        borderColor: '#2196F3',
        borderWidth: 1,
        barThickness: barThickness
      });
    }

    if (showLs) {
      datasets.push({
        label: '✨ 生命讀經 (%)',
        data: displayed.map(item => item.lsPct),
        backgroundColor: 'rgba(255, 152, 0, 0.85)',
        borderColor: '#FF9800',
        borderWidth: 1,
        barThickness: barThickness
      });
    }

    // 自訂背景插件以確保圖片導出有白色底色
    const whiteBackgroundPlugin = {
      id: 'customCanvasBackgroundColor',
      beforeDraw: (chart) => {
        const {ctx} = chart;
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, chart.width, chart.height);
        ctx.restore();
      }
    };

    statsChartInstance = new Chart(canvas, {
      type: 'bar',
      plugins: [whiteBackgroundPlugin],
      data: {
        labels: labels,
        datasets: datasets
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: {
              font: { family: '"Noto Sans TC", sans-serif', size: 12, weight: 'bold' },
              color: '#333'
            }
          },
          title: {
            display: true,
            text: '📖 排行回顧',
            color: '#2E7D32',
            font: { family: '"Noto Sans TC", sans-serif', size: 16, weight: 'bold' },
            padding: { top: 10, bottom: 15 }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` ${context.dataset.label.split(' ')[0]} ${context.raw}%`;
              }
            }
          }
        },
        scales: {
          x: {
            min: 0,
            max: xAxisMax,
            grid: { color: '#f0f0f0' },
            ticks: {
              callback: function(value) { return value + '%'; },
              font: { size: 11 },
              color: '#666'
            }
          },
          y: {
            grid: { display: false },
            ticks: {
              font: { family: '"Noto Sans TC", sans-serif', size: 13, weight: '500' },
              color: '#333'
            }
          }
        }
      }
    });
  };

  function renderLsBookList() {
    const list = document.getElementById('tab-content-ls');
    if (!list) return;
    list.innerHTML = '';

    const lsDoneSet = new Set(globalProgress['LifeStudy'] || []);
    const books = [...BIBLE_DATA.OT, ...BIBLE_DATA.NT];
    const frag = document.createDocumentFragment();

    let countIndex = 1;
    books.forEach(book => {
      const bookName = book.n;
      const abbr = BOOK_NAME_TO_ABBR[bookName];
      if (!abbr) return;

      let lsItems = [];
      for (let range in lsMapping.range_map) {
        if (range.startsWith(abbr)) {
          lsItems.push(...lsMapping.range_map[range]);
        }
      }
      if (lsMapping.unhooked[bookName]) {
        lsItems.push(...lsMapping.unhooked[bookName]);
      }

      if (lsItems.length === 0) return;

      const uniqueItems = Array.from(new Set(lsItems))
        .filter(item => item && item !== "無" && item !== "＿" && item.includes("生讀"))
        .sort((a, b) => {
          const na = parseInt(a.match(/\d+/) || 0);
          const nb = parseInt(b.match(/\d+/) || 0);
          return na - nb;
        });

      if (uniqueItems.length === 0) return;

      const done = uniqueItems.filter(item => lsDoneSet.has(item)).length;
      const total = uniqueItems.length;
      const pct = (done / total) * 100;

      const row = document.createElement('div');
      row.className = 'book-row';
      row.onclick = () => openLsBook(bookName, uniqueItems);
      row.innerHTML = `
        <div class="book-row-main">
          <div class="book-row-left"><span class="book-number">${countIndex++}</span><span class="book-name">${bookName} 生命讀經</span></div>
          <div class="book-row-right">${done === total ? '完成' : done + ' / ' + total} ❯</div>
        </div>
        <div class="mini-progress-bg"><div class="mini-progress-fill" style="width:${pct}%"></div></div>`;
      frag.appendChild(row);
    });
    list.appendChild(frag);
  }

  function savePlanProgress() {
    let addedPlan = [], removedPlan = [];
    const otRow = document.getElementById('pt-ot-row');
    const ntRow = document.getElementById('pt-nt-row');

    if (otRow.classList.contains('selected')) addedPlan.push(currentPlanDay + '_OT');
    if (otRow.classList.contains('pending-remove')) removedPlan.push(currentPlanDay + '_OT');

    if (ntRow.classList.contains('selected')) addedPlan.push(currentPlanDay + '_NT');
    if (ntRow.classList.contains('pending-remove')) removedPlan.push(currentPlanDay + '_NT');

    let addedLS = Array.from(document.querySelectorAll('#ls-chips-wrap .ls-chip.selected')).map(c => c.dataset.lsName);
    let removedLS = Array.from(document.querySelectorAll('#ls-chips-wrap .ls-chip.pending-remove')).map(c => c.dataset.lsName);

    const finishSave = () => {
      selectPlanDay(currentPlanDay);
      renderPlanGrid();
    };

    const hasPlanChange = addedPlan.length > 0 || removedPlan.length > 0;
    const hasLsChange = addedLS.length > 0 || removedLS.length > 0;

    if (hasPlanChange && hasLsChange) {
      executeSave('一年讀經', addedPlan, removedPlan, (prevResult) => {
        executeSave('LifeStudy', addedLS, removedLS, finishSave, true, prevResult);
      }, false);
    } else if (hasPlanChange) {
      executeSave('一年讀經', addedPlan, removedPlan, finishSave);
    } else if (hasLsChange) {
      executeSave('LifeStudy', addedLS, removedLS, finishSave);
    }
  }

      const removed = Array.from(document.querySelectorAll('#chapter-grid .chapter-box.pending-remove')).map(b => b.dataset.chapter.trim());

      if (!added.length && !removed.length) return showAlert("請點選章節");

        if (book) openNormalBook(book.n, book.c);
      });
    }
  }

  function confirmClear(type, label) {
    if (!userId) {
      showToast("錯誤: 用戶ID為空");
      return;
    }
    showConfirm(`確定要清除您的「${label}」嗎？\n此動作將永久刪除伺服器上的紀錄！`, function () {
      if (typeof google === 'undefined') {
        showToast("Google API 未載入");
        return;
      }

      showOpLoading(`正在清除${label}...`);

      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.status === 'error') {
            showOpFailure('清除失敗: ' + (result.message || '未知錯誤'));
            return;
          }
          // 直接更新本地進度，免除二次網路請求
          globalProgress = result.updatedProgress || {};
          saveProgressToLocal();
          showOpSuccess(`${label}已成功清除!`, function () {
            if (currentTestament === 'Plan') renderPlanGrid();
            else if (currentTestament === 'LS') renderLsBookList();
            else renderBookList();
          });
        })
        .withFailureHandler(function (err) {
          showOpFailure('清除失敗: ' + err);
        })
        .clearUserProgress(userId, userAccount, userSessionToken, type, groupId);
    }, true);
  }

  function showConfirm(message, onConfirm, isDanger) {
    const modal = document.getElementById('custom-modal');
    document.getElementById('custom-modal-msg').innerText = message;
    const cancelBtn = document.getElementById('custom-modal-cancel');
    const okBtn = document.getElementById('custom-modal-ok');
    cancelBtn.style.display = '';
    okBtn.className = 'custom-modal-ok' + (isDanger ? ' danger' : '');
    modal.classList.add('visible');
    okBtn.onclick = () => { modal.classList.remove('visible'); onConfirm(); };
    cancelBtn.onclick = () => { modal.classList.remove('visible'); };
  }

  function showAlert(message) {
    const modal = document.getElementById('custom-modal');
    document.getElementById('custom-modal-msg').innerText = message;
    const cancelBtn = document.getElementById('custom-modal-cancel');
    const okBtn = document.getElementById('custom-modal-ok');
    cancelBtn.style.display = 'none';
    okBtn.className = 'custom-modal-ok';
    modal.classList.add('visible');
    okBtn.onclick = () => { modal.classList.remove('visible'); };
  }

  function showToast(message) {
    let toastContainer = document.getElementById('toast-container');
    if (!toastContainer) {
      toastContainer = document.createElement('div');
      toastContainer.id = 'toast-container';
      toastContainer.style.cssText = 'position:fixed;bottom:120px;left:10px;right:10px;z-index:10001;max-width:calc(100% - 20px);';
      document.body.appendChild(toastContainer);
    }

    // 限制最多顯示 3 個 toast，移除最舊的
    while (toastContainer.children.length >= 3) {
      toastContainer.removeChild(toastContainer.firstChild);
    }

    const toast = document.createElement('div');
    toast.style.cssText = 'background:#2c3e50;color:white;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:8px;word-wrap:break-word;box-shadow:0 2px 8px rgba(0,0,0,0.2);';
    toast.innerText = message;
    toastContainer.appendChild(toast);

    console.log("💬 Toast: " + message);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  function setSaveUiState(isSaving) {
    isSavingProgress = isSaving;
    const planSaveBtn = document.getElementById('plan-save-btn');
    const normalSaveBtn = document.querySelector('.save-btn');

    if (planSaveBtn) {
      planSaveBtn.disabled = isSaving;
      planSaveBtn.style.opacity = isSaving ? '0.65' : '1';
      planSaveBtn.style.cursor = isSaving ? 'not-allowed' : 'pointer';
    }

    if (normalSaveBtn) {
      normalSaveBtn.disabled = isSaving;
      normalSaveBtn.style.opacity = isSaving ? '0.65' : '1';
      normalSaveBtn.style.cursor = isSaving ? 'not-allowed' : 'pointer';
    }

    if (isSaving) {
      showOpLoading('儲存中...');
    } else {
      hideOpLoading();
    }
  }

  // --- 共用儲存 ---
  function executeSave(bName, added, removed, cb, showSuccessMsg = true, initialCounts = null) {
    if (isSavingProgress) {
      showToast('儲存中，請稍候...');
      return;
    }

    const safeAdded = Array.from(new Set((added || []).map(c => String(c).trim()).filter(Boolean)));
    const safeRemoved = Array.from(new Set((removed || []).map(c => String(c).trim()).filter(Boolean)));

    if (!bName || (safeAdded.length === 0 && safeRemoved.length === 0)) return;

    setSaveUiState(true);

    // 樂觀更新進度緩存
    const oldProgress = [...(globalProgress[bName] || [])];
    if (!globalProgress[bName]) globalProgress[bName] = [];

    // 移除
    if (safeRemoved.length > 0) {
      const removedSet = new Set(safeRemoved);
      globalProgress[bName] = globalProgress[bName].filter(c => !removedSet.has(c));
    }
    // 新增
    if (safeAdded.length > 0) {
      const existingSet = new Set(globalProgress[bName]);
      safeAdded.forEach(c => {
        if (!existingSet.has(c)) globalProgress[bName].push(c);
      });
    }

    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler((result) => {
          console.log("syncProgress 回應:", result);

          if (result && result.status === "error") {
            // 伺服器失敗，回滾記憶體狀態
            globalProgress[bName] = oldProgress;
            showOpFailure('同步失敗: ' + (result.message || '未知錯誤'), () => {
              setSaveUiState(false);
            });
            return;
          }

          // 伺服器確認成功，才寫入 localStorage
          saveProgressToLocal();

          if (showSuccessMsg) {
            const totalAdded = (result.addedCount || 0) + (initialCounts?.addedCount || 0);
            const totalRemoved = (result.removedCount || 0) + (initialCounts?.removedCount || 0);

            let msg = "";
            if (totalAdded && totalRemoved) msg = `已同步 (新增 ${totalAdded}, 移除 ${totalRemoved})`;
            else if (totalAdded) msg = `已新增 ${totalAdded} 筆`;
            else if (totalRemoved) msg = `已移除 ${totalRemoved} 筆`;
            else msg = "已同步完成";

            showOpSuccess(msg, () => {
              setSaveUiState(false);
              if (cb) cb();
            });
          } else {
            isSavingProgress = false; // 暫時設為 false，允許下一個序列儲存呼叫
            if (cb) cb(result);
          }
        })
        .withFailureHandler((err) => {
          // 伺服器失敗，回滾
          globalProgress[bName] = oldProgress;
          showOpFailure('同步失敗: ' + err, () => {
            setSaveUiState(false);
          });
        })
        .syncProgress({
          userId, groupId, username: userAccount, sessionToken: userSessionToken,
          book: bName,
          addedChapters: safeAdded,
          removedChapters: safeRemoved
        });
    } else {
      if (cb) cb();
      setSaveUiState(false);
    }
  }

  function openProgressView() {
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-progress').classList.add('active');

    // 計算逐卷章節進度
    let otChaptersDone = 0;
    let ntChaptersDone = 0;
    BIBLE_DATA.OT.forEach(book => { otChaptersDone += (globalProgress[book.n]?.length || 0); });
    BIBLE_DATA.NT.forEach(book => { ntChaptersDone += (globalProgress[book.n]?.length || 0); });

    // 計算一年讀經進度
    const planDoneSet = new Set(globalProgress['一年讀經'] || []);
    let planOtDone = 0;
    let planNtDone = 0;
    for (let day = 1; day <= TOTAL_PLAN; day++) {
      if (planDoneSet.has(day + '_OT')) planOtDone++;
      if (planDoneSet.has(day + '_NT')) planNtDone++;
    }
    // 百分比輔助函式
    const calcPct = (done, total) => total === 0 ? 0 : parseFloat(((done / total) * 100).toFixed(2));
    const otPct = calcPct(otChaptersDone, TOTAL_OT);
    const ntPct = calcPct(ntChaptersDone, TOTAL_NT);
    const planOtPct = calcPct(planOtDone, TOTAL_PLAN);
    const planNtPct = calcPct(planNtDone, TOTAL_PLAN);

    // 更新 UI
    document.getElementById('pct-ot').innerText = otPct + '%';
    document.getElementById('bar-ot').style.width = otPct + '%';
    document.getElementById('txt-ot').innerText = `${otChaptersDone} / ${TOTAL_OT} 章`;

    document.getElementById('pct-nt').innerText = ntPct + '%';
    document.getElementById('bar-nt').style.width = ntPct + '%';
    document.getElementById('txt-nt').innerText = `${ntChaptersDone} / ${TOTAL_NT} 章`;

    document.getElementById('pct-plan-ot').innerText = planOtPct + '%';
    document.getElementById('bar-plan-ot').style.width = planOtPct + '%';
    document.getElementById('txt-plan-ot').innerText = `${planOtDone} / ${TOTAL_PLAN} 天`;

    document.getElementById('pct-plan-nt').innerText = planNtPct + '%';
    document.getElementById('bar-plan-nt').style.width = planNtPct + '%';
    document.getElementById('txt-plan-nt').innerText = `${planNtDone} / ${TOTAL_PLAN} 天`;

    // 生命讀經進度 (分割新舊約)
    const lsDoneList = globalProgress['LifeStudy'] || [];
    let lsOTDone = 0;
    let lsNTDone = 0;
    lsDoneList.forEach(item => {
      const info = formatLsName(item);
      if (OT_BOOKS_SHORT_SET.has(info.prefix)) lsOTDone++;
      else if (NT_BOOKS_SHORT_SET.has(info.prefix)) lsNTDone++;
    });

    const lsOTPct = calcPct(lsOTDone, TOTAL_LS_OT);
    const lsNTPct = calcPct(lsNTDone, TOTAL_LS_NT);

    document.getElementById('pct-ls-ot').innerText = lsOTPct + '%';
    document.getElementById('bar-ls-ot').style.width = lsOTPct + '%';
    document.getElementById('txt-ls-ot').innerText = `${lsOTDone} / ${TOTAL_LS_OT} 篇`;

    document.getElementById('pct-ls-nt').innerText = lsNTPct + '%';
    document.getElementById('bar-ls-nt').style.width = lsNTPct + '%';
    document.getElementById('txt-ls-nt').innerText = `${lsNTDone} / ${TOTAL_LS_NT} 篇`;
  }


  window.onload = loadStaticDataAndInit;
</script>
